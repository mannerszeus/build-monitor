<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Build Monitor</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182234;font-family:Arial,"Noto Sans KR",sans-serif}
.shell{min-height:100vh;display:flex}.sidebar{width:240px;background:#101827;color:white;padding:26px 16px;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:0 10px 35px}.brand>b{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#7dd3fc,#a78bfa);font-size:20px}
.brand strong,.brand small{display:block}.brand small{color:#8795ab;font-size:10px;margin-top:4px}.sidebar nav button{display:block;width:100%;text-align:left;background:none;color:#91a0b7;padding:12px;border-radius:9px;margin:3px 0;border:0;font-size:13px;cursor:pointer}
.sidebar nav .active,.sidebar nav button:hover{background:#1c283a;color:#fff}.sidebar footer{margin-top:auto;color:#8491a7;font-size:11px;padding:10px}.sidebar footer small{display:block;margin-top:8px;color:#647187}
.content{flex:1;padding:34px 42px;overflow:auto}header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:27px}
header label,.modal label{font-size:10px;font-weight:800;letter-spacing:.14em;color:#8d98a9}h1{font-size:28px;margin:7px 0 5px;letter-spacing:-.04em}header p{margin:0;color:#7f8999;font-size:13px}
.live{font-size:11px;color:#697589}.live i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e2e9fb;color:#536ba7;font-style:normal}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #e7ebf2;border-radius:15px;box-shadow:0 3px 14px #15203308}
.card{padding:19px 20px}.card>span{font-size:12px;color:#7d8798}.card strong{display:block;font-size:27px;margin-top:6px}.card strong small{font-size:12px;font-weight:400;color:#929bab;margin-left:4px}.card em{display:block;font-style:normal;color:#a0a8b5;font-size:10px;margin-top:6px}
.blue{border-top:3px solid #9bd2f0}.purple{border-top:3px solid #b9a8ee}.green{border-top:3px solid #9ad7ba}.red{border-top:3px solid #e7a4a4}
.panel{overflow:hidden}.head{padding:19px 21px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;align-items:center}.head h2{font-size:15px;margin:0 0 4px}.head span{font-size:10px;color:#9aa3b1}
.filters{display:flex;gap:5px}.filters button{border:0;background:#f3f5f8;color:#7e8999;padding:7px 10px;border-radius:8px;font-size:10px;cursor:pointer}.filters .sel{background:#1d293b;color:#fff}
table{width:100%;border-collapse:collapse;font-size:11px}th{background:#fbfcfd;color:#99a2b0;font-size:10px;text-align:left;padding:12px 15px}td{padding:14px 15px;border-top:1px solid #f0f2f5;color:#536074}tbody tr{cursor:pointer}tbody tr:hover{background:#fafbfe}
td b{display:block;color:#263247}td small{display:block;color:#a0a8b5;font-size:9px;margin-top:4px}.mono{font-family:Consolas,monospace;font-size:10px}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-style:normal;font-weight:700;font-size:9px}.running{background:#e4f3ff;color:#3887bb}.success{background:#e4f7ed;color:#3e9a71}.failed{background:#ffebeb;color:#c96767}.cancelled{background:#f0f1f3;color:#7c8491}
.bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px}.system{padding:12px 21px}.system>b{font-size:11px}.system>span{float:right;color:#939cab;font-size:10px}.system>div{height:5px;background:#edf0f4;border-radius:9px;margin-top:8px}.system i{display:block;height:100%;background:#91a9e7;border-radius:9px}
.collector-body{padding:24px 21px}.collector-body strong{font-size:13px}.collector-body p{font-size:10px;color:#929baa}.next{margin:0 21px 20px;padding:11px;background:#f7f8fa;color:#8c95a4;font-size:10px;border-radius:8px}.next b{color:#56637a}
.back{position:fixed;inset:0;background:#11182766;backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:10}.modal{position:relative;width:min(700px,100%);background:white;border-radius:18px;padding:25px;box-shadow:0 20px 70px #11182730}.modal h2{margin:7px 0 20px}.close{position:absolute;right:20px;top:20px;border:0;background:#f2f4f7;border-radius:8px;font-size:20px;width:30px;height:30px;cursor:pointer}
.details{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.details span{font-size:9px;color:#98a2b0}.details b{display:block;color:#273247;font-size:10px;margin-top:6px}.modal h3{font-size:12px;display:flex;justify-content:space-between}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stages div{padding:13px 5px;text-align:center;border:1px solid #e7ebf0;border-radius:9px;color:#a0a8b4;font-size:10px}.stages b{display:block;margin-top:6px;font-size:9px}.stages .done{background:#f1fbf6;border-color:#d9eee3;color:#479876}.stages .fail{background:#fff2f2;border-color:#f0d2d2;color:#c96666}.modal pre{margin:20px 0 0;background:#111827;color:#aeb9ca;border-radius:10px;padding:15px;font:10px/1.8 Consolas,monospace;white-space:pre-wrap}
@media(max-width:900px){.sidebar{display:none}.content{padding:22px}.stats{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr}.filters{display:none}.details{grid-template-columns:1fr 1fr}}

.env{display:inline-block;padding:4px 7px;border-radius:6px;font-style:normal;font-size:9px;font-weight:700}
.env.개발{background:#f0ecff;color:#7562b4}.env.테스트{background:#e8f5ff;color:#3984b0}.env.운영{background:#e8f7ed;color:#3e926c}
table{table-layout:fixed}th:nth-child(1){width:17%}th:nth-child(2){width:8%}th:nth-child(3){width:17%}th:nth-child(4){width:10%}th:nth-child(5){width:15%}th:nth-child(6){width:8%}th:nth-child(7){width:15%}th:nth-child(8){width:10%}
td,th{white-space:nowrap}td{padding:9px 12px;font-size:10px}th{padding:9px 12px}.panel .head{padding:16px 20px}

button,input,select{font:inherit}button,.file-button{cursor:pointer;border:1px solid #cbd5e1;background:white;color:#273247;padding:9px 12px;border-radius:8px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3887bb;outline-offset:2px}.toolbar,.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.tabs .active{background:#1d293b;color:white}.toolbar input[type=search]{flex:1;min-width:180px}.toolbar input,.toolbar select{padding:10px;border:1px solid #cbd5e1;border-radius:8px}#source{padding:12px 0;font-size:12px;color:#536074}#source.stale,#error{color:#b42318}#error{padding:12px;background:#fff2f2;border-radius:8px;margin-bottom:14px}#results{overflow:auto;max-height:65vh}table{min-width:940px}td,th{white-space:normal;overflow-wrap:anywhere}.empty{padding:28px;color:#697589}.statistics{padding:24px}.stat-line{display:grid;grid-template-columns:90px 70px 1fr;gap:12px;margin-bottom:14px;align-items:center}progress{width:100%;height:16px}.row-button{border:0;background:none;padding:0;font-weight:700;text-align:left;color:#263247}dialog.modal{border:0;max-height:85vh;overflow:auto}dialog::backdrop{background:#11182788}#mLog{max-height:38vh;overflow:auto}#mStages{font-size:12px;color:#697589}.file-button{position:relative}.file-button input{position:absolute;width:1px;height:1px;opacity:0}.file-button:focus-within{outline:3px solid #3887bb;outline-offset:2px}header{gap:16px}header .toolbar{justify-content:flex-end}.unknown{background:#fff5d8;color:#8c6417}.env.미확인{background:#f0f1f3;color:#7c8491}@media(max-width:700px){header{display:block}.content{padding:16px}h1{font-size:24px}header .toolbar{justify-content:flex-start;margin-top:15px}.tabs button{flex:1;white-space:nowrap;font-size:12px}.stats{gap:8px}.card{padding:12px}.modal{padding:18px}.details{grid-template-columns:1fr 1fr}}
</style><script defer src="public/dashboard-model.js"></script><script defer src="public/dashboard.js"></script></head>
<body><main class="shell"><aside class="sidebar"><div class="brand"><b>B</b><div><strong>Build Monitor</strong><small>BuildForge Operations</small></div></div><p>배포 상태 · 실행 이력 · 로그</p><footer>JSON 스냅샷 모니터<br><small>실제 연동 전에는 예제 또는 파일 데이터를 사용합니다.</small></footer></aside>
<section class="content"><header><div><label>OPERATIONS / DEPLOYMENT</label><h1>배포 모니터링</h1><p>수집된 실행 상태를 확인하세요.</p></div><div class="toolbar"><label class="file-button">JSON 파일 열기<input id="import" type="file" accept=".json,application/json"></label><button id="demo">예제 보기</button><button id="connect">사내 스냅샷 연결</button></div></header>
<div id="source" role="status" aria-live="polite"></div><div id="error" role="alert" hidden></div>
<section class="stats" aria-label="스냅샷 통계"><div class="card blue"><span>현재 스냅샷</span><strong id="total">0</strong></div><div class="card purple"><span>진행 중</span><strong id="running">0</strong></div><div class="card red"><span>실패</span><strong id="failed">0</strong></div><div class="card green"><span>완료 건 성공률</span><strong id="rate">—</strong></div></section>
<nav class="tabs" aria-label="모니터링 메뉴"><button class="active" data-view="recent">최근 배포 20개</button><button data-view="running">진행 중</button><button data-view="systems">시스템 현황</button><button data-view="stats">통계·분석</button><button data-view="logs">로그 조회</button></nav>
<div class="toolbar"><select id="environment" aria-label="환경"><option value="ALL">전체 환경</option><option>개발</option><option>테스트</option><option>운영</option><option>미확인</option></select><select id="status" aria-label="상태"><option value="ALL">전체 상태</option><option value="RUNNING">진행 중</option><option value="SUCCESS">성공</option><option value="FAILED">실패</option><option value="CANCELLED">취소</option><option value="UNKNOWN">미확인</option></select><input id="search" type="search" aria-label="배포·로그 검색" placeholder="시스템, 프로젝트, 실행자, 실행 ID, 로그 검색"></div>
<section class="panel"><div class="head"><div><h2 id="viewTitle">최근 배포</h2><span id="summary"></span></div><span>시스템명을 누르면 상세·로그를 볼 수 있습니다.</span></div><div id="results"></div></section></section></main>
<dialog class="modal" id="modal" aria-labelledby="mSystem"><button class="close" id="close" aria-label="상세 닫기">×</button><label>DEPLOYMENT DETAIL</label><h2 id="mSystem"></h2><div class="details"><span>실행 ID<b id="mId"></b></span><span>프로젝트<b id="mBuild"></b></span><span>실행자<b id="mExecutor"></b></span><span>환경<b id="mServer"></b></span></div><h3>수집된 상태 <em id="mStatus" class="badge"></em></h3><div id="mStages"></div><pre id="mLog"></pre></dialog></body></html>
